name: Validate BirthdayFractal website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check worker.js
      - name: Validate sitemap and search metadata
        run: python3 scripts/check_seo.py
