name: Validate scientific research code
on:
  push:
    branches: [main]
    paths:
      - 'PythonCode/**'
      - '.github/workflows/research-check.yml'
  pull_request:
    paths:
      - 'PythonCode/**'
      - '.github/workflows/research-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact-arithmetic dependencies
        run: python -m pip install --disable-pip-version-check sympy==1.14.0 mpmath==1.3.0
      - name: Check Python syntax and source data
        run: |
          python - <<'PY'
          import ast, csv, json
          from pathlib import Path

          root = Path('PythonCode')
          scripts = sorted(root.rglob('*.py'))
          assert len(scripts) == 13, f'Expected 13 Python files, got {len(scripts)}'
          for script in scripts:
              ast.parse(script.read_text(encoding='utf-8'), filename=str(script))
          docs = list((root / 'results').glob('*.json'))
          assert len(docs) == 4, f'Expected 4 JSON results, got {len(docs)}'
          for document in docs:
              json.loads(document.read_text(encoding='utf-8'))
          with (root / 'results/dates.csv').open(newline='', encoding='utf-8') as file:
              records = list(csv.DictReader(file))
          assert len(records) == 38, f'Expected 38 dates, got {len(records)}'
          print('13 Python files, 4 JSON results, and 38 dates validated')
          PY
      - name: Recompute exact certificates
        working-directory: PythonCode
        run: |
          python certify_trapping.py
          python certify_orbit_intervals.py
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ('trapping_certificate.json', 'orbit_intervals_certificate.json'):
              data = json.loads((Path('results') / name).read_text(encoding='utf-8'))
              assert data.get('certified') is True, f'Certificate failed: {name}'
              print(name, 'certified: true')
          PY
