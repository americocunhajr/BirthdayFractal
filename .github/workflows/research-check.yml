name: Validate scientific research code
on:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - '.github/workflows/research-check.yml'
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/research-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact-arithmetic dependencies
        run: python -m pip install --disable-pip-version-check sympy==1.14.0 mpmath==1.3.0
      - name: Check Python syntax and source data
        run: |
          python - <<'PY'
          import ast, csv, json
          from pathlib import Path

          root = Path('research/ESM_2')
          scripts = list(root.rglob('*.py'))
          assert len(scripts) == 14, len(scripts)
          for script in scripts:
              ast.parse(script.read_text(encoding='utf-8'), filename=str(script))
          for document in root.glob('*.json'):
              json.loads(document.read_text(encoding='utf-8'))
          with (root / 'supplementary_dates.csv').open(newline='', encoding='utf-8') as f:
              assert len(list(csv.DictReader(f))) == 38
          print('14 Python scripts, JSON records, and 38 dates verified')
          PY
      - name: Recompute the two exact certificates
        working-directory: research/ESM_2
        run: |
          python certifica_aprisionamento.py
          python certifica_mandelbrot.py
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in ('certificado_aprisionamento.json', 'certificado_mandelbrot.json'):
              content = json.loads(Path(filename).read_text(encoding='utf-8'))
              assert content.get('certificado') is True, f'Certificate failed: {filename}'
              print(filename, 'certificado: True')
          PY
