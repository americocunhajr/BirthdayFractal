name: Import author research source archive
on:
  push:
    branches: [main]
    paths:
      - "research/.import/part-00.b64"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify checksum, extract safely, and check Python syntax
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path

          parts = sorted(Path("research/.import").glob("part-*.b64"))
          assert len(parts) == 8, "Expected 8 archive fragments"
          encoded = b"".join(p.read_bytes() for p in parts)
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = "3f7be0a71013ce08ba9a00a92427d8b09409bab979efa48e83b4c5b3f1a6208b"
          assert digest == expected, f"Archive checksum mismatch: {digest}"

          with tarfile.open(fileobj=io.BytesIO(data), mode="r:xz") as archive:
              for entry in archive:
                  assert entry.isfile(), "Nonregular archive entry rejected"
                  p = Path(entry.name)
                  assert not p.is_absolute() and ".." not in p.parts, "Unsafe archive path"
                  assert str(p) == "research/README.md" or str(p).startswith("research/ESM_2/"), "Unexpected path"
                  destination = Path.cwd() / p
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.extractfile(entry).read())

          print("Research archive validated and extracted")
          PY
          python -m compileall -q research/ESM_2
          find research/ESM_2 -type d -name __pycache__ -exec rm -rf {} +
          rm -rf research/.import
      - name: Commit the author-provided Python and supplementary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research
          git diff --cached --quiet || git commit -m "Import ESM_2 source, data, exact certificates and documentation"
          git push origin HEAD:main
